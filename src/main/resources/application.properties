spring.application.name=sales-data-pipeline
server.port=8080

# Embedded H2 file database (creates data/pipeline.db.mv.db)
spring.datasource.url=jdbc:h2:file:./data/pipeline.db
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# ---- Pipeline ----
pipeline.input-dir=data/input
pipeline.processed-dir=data/processed
pipeline.rejected-dir=data/rejected
# Time between scheduled runs (ISO-8601 duration, e.g. PT30S, PT5M, PT1H)
pipeline.schedule-interval=PT1M
# Format of sale_date values, java.time pattern
pipeline.date-format=yyyy-MM-dd

# CSV header names - change these if your file uses different headers
pipeline.columns.sale-id=sale_id
pipeline.columns.sale-date=sale_date
pipeline.columns.product-name=product_name
pipeline.columns.category=category
pipeline.columns.quantity=quantity
pipeline.columns.unit-price=unit_price
pipeline.columns.payment-method=payment_method
